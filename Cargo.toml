[package]
name = "zentao-cli"
version = "0.2.0"
edition = "2021"
authors = ["zhanglinan <lennan747@gmail.com>"]
license = "MIT"
description = "禅道v9.0.3 命令行客户端"
repository = "https://github.com/lennan747/zentao-cli"
keywords = ["zentao", "cli", "command-line", "bug-tracking", "productivity"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.80"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.29"
directories = "5"
flate2 = "1"
html-escape = "0.2"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url = "2"
zip = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
