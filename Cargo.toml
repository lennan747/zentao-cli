[package]
name = "zentao-cli"
version = "0.1.0"
edition = "2021"
authors = ["leo <leo@example.com>"]
license = "MIT"
description = "禅道v9.0.3 命令行客户端"
rust-version = "1.80"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
cookie_store = { version = "0.21", features = ["serde"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
reqwest_cookie_store = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
